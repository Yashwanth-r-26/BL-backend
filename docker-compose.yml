# Local stack: Postgres, a one-shot migration runner, and the API.
#
# The `migrate` service exists so the API never starts against an un-migrated
# database, and so migrations run exactly once no matter how many API replicas
# come up. The container entrypoint can also migrate on boot -- convenient for
# a single instance on a platform with no separate job runner -- but that races
# when several replicas start together, which is why RUN_MIGRATIONS=0 is set
# here and the job owns it instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interior}
      POSTGRES_DB: ${POSTGRES_DB:-interior_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interior} -d ${POSTGRES_DB:-interior_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interior}:${POSTGRES_PASSWORD:-interior}@db:5432/${POSTGRES_DB:-interior_ai}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interior}:${POSTGRES_PASSWORD:-interior}@db:5432/${POSTGRES_DB:-interior_ai}
      RUN_MIGRATIONS: "0"          # the migrate service already did it
      # Passed through from your shell, so a key is never written to a file
      # that could be committed.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_DETECT_MODEL: ${GEMINI_DETECT_MODEL:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: